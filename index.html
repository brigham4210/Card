<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f9;
            margin: 0;
            padding: 20px;
        }

        #folderInput {
            margin-bottom: 20px;
        }

        .folder {
            margin-bottom: 30px;
        }

        .folder h2 {
            margin: 0 0 10px;
        }

        .row {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .row img {
            height: 480px;
            width: auto;
            object-fit: contain;
            background: white;
            border-radius: 15px;
            border: 5px solid silver;
        }

        #returnLink {
            display: inline-block;
            margin-bottom: 20px;
            color: #333;
            text-decoration: none;
            font-weight: bold;
        }

        #returnLink:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <a id="returnLink" href="https://brigham4210.github.io/">&larr; Return</a>

    <div id="gallery"></div>

    <script>
        // Add a folder name and its image paths here to display a new row
        const folders = {
            "Jeremy Lin": [
                "Jeremy Lin/Slide1.jpeg",
                "Jeremy Lin/Slide2.jpeg",
                "Jeremy Lin/Slide3.jpeg",
                "Jeremy Lin/Slide4.jpeg",
                "Jeremy Lin/Slide5.jpeg",
                "Jeremy Lin/Slide6.jpeg",
                "Jeremy Lin/Slide7.jpeg",
                "Jeremy Lin/Slide8.jpeg",
                "Jeremy Lin/Slide9.jpeg",
                "Jeremy Lin/Slide10.jpeg",
                "Jeremy Lin/Slide11.jpeg",
                "Jeremy Lin/Slide12.jpeg",
                "Jeremy Lin/Slide13.jpeg",
                "Jeremy Lin/Slide14.jpeg"
            ],
            "Grim Reapers": [
                "Grim Reapers/Slide1.jpeg",
                "Grim Reapers/Slide2.jpeg",
                "Grim Reapers/Slide3.jpeg",
                "Grim Reapers/Slide4.jpeg",
                "Grim Reapers/Slide5.jpeg",
                "Grim Reapers/Slide6.jpeg",
                "Grim Reapers/Slide7.jpeg",
                "Grim Reapers/Slide8.jpeg",
                "Grim Reapers/Slide9.jpeg"
            ],
            "Joker": [
                "Joker/Slide1.jpeg",
                "Joker/Slide2.jpeg",
                "Joker/Slide3.jpeg"
            ],
            "Slam Dunk": [
                "Slam Dunk/Slide1.jpeg",
                "Slam Dunk/Slide2.jpeg",
                "Slam Dunk/Slide3.jpeg",
                "Slam Dunk/Slide4.jpeg",
                "Slam Dunk/Slide5.jpeg",
                "Slam Dunk/Slide6.jpeg",
                "Slam Dunk/Slide7.jpeg",
                "Slam Dunk/Slide8.jpeg"
            ]
        };

        const gallery = document.getElementById("gallery");

        // Create one row per folder
        for (const folderName of Object.keys(folders)) {

            const folder = document.createElement("div");
            folder.className = "folder";

            const title = document.createElement("h2");
            title.textContent = folderName;

            const row = document.createElement("div");
            row.className = "row";

            for (const path of folders[folderName]) {

                const img = document.createElement("img");

                img.src = path;
                img.alt = path;
                img.title = path;

                row.appendChild(img);
            }

            folder.appendChild(title);
            folder.appendChild(row);

            gallery.appendChild(folder);
        }
    </script>

</body>
</html>
